syntax = "proto3";
package msg;

import "comm_macro.proto";


message ShopGoodsInfo
{
    uint32 id = 1;
    uint32 money_id = 2;
    uint32 money_num = 3;
    EnmPeriodType period_type = 4;
    uint32 period_num = 5; 
}



message CSShopGoods
{
    int32 shop_id = 1;
}



message SCShopGoods
{
    int32 result  = 1;
    int32 shop_id = 2;
    repeated ShopGoodsInfo goods = 3; 
}


message ShopGoodsDesc
{
    uint32 id = 1;
    uint32 num = 2;
}



message CSShopBuy
{
    int32 shop_id = 1;
    repeated ShopGoodsDesc goods = 2;
}



message SCShopBuy
{
    int32 result = 1;
    int32 shop_id = 2;
    repeated ShopGoodsDesc goods = 3;
}
