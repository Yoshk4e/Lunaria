syntax = "proto3";
package msg;

import "comm_data.proto";


message CmdOneBattelPassData
{
    uint32 id = 1;
    uint32 level = 2;
    uint32 exp = 3;
    uint32 award_lv = 4;
}



message CSBattlePassData
{
    repeated uint32 battle_pass_id = 1;
}



message SCBattlePassData
{
    int32 result = 1;
    repeated CmdOneBattelPassData datas = 2;
}



message CSBattlePassAward
{
    uint32 id = 1;
}



message SCBattlePassAward
{
    int32 result = 1;
    uint32 id = 2;
    uint32 level = 3;
    repeated CmdItem items = 4;
}



message SCBattlePassNtf
{
    CmdOneBattelPassData data = 1;
}