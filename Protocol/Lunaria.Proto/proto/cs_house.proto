syntax = "proto3";
package msg;

import "comm_macro.proto";

message HouseInfo
{
    uint32 house_id = 1; 
    EnmHouseState state = 2; 
    uint32 level = 3; 
    uint32 income = 4; 
}



message CSReqHouseInfo
{
}



message SCResHouseInfo
{
    uint32 result = 1; 
    repeated HouseInfo house_list = 2;  
}



message CSReqBuyHouse
{
    uint32 house_id = 1; 
}



message SCResBuyHouse
{
    uint32 result = 1; 
    HouseInfo house_info = 2; 
}



message CSReqOpenHouse
{
    uint32 house_id = 1; 
}



message SCResOpenHouse
{
    uint32 result = 1; 
    HouseInfo house_info = 2; 
}



message CSReqUpgradeHouse
{
    uint32 house_id = 1; 
}



message SCResUpgradeHouse
{
    uint32 result = 1; 
    HouseInfo house_info = 2; 
}



message SCHouseIncomeNtf
{
    repeated HouseInfo house_info_list = 1; 
}



message CSReqClaimHouseIncome
{
}



message SCResClaimHouseIncome
{
    uint32 result = 1; 
    repeated HouseInfo house_info_list = 2; 
}
