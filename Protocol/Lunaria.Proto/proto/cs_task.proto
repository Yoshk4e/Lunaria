syntax = "proto3";
package msg;
import "comm_data.proto";
import "comm_macro.proto";



message CSTaskList
{
}



message SCTaskList
{
    int32  result = 1;


    PlayerTaskData task_data = 4; 
}



message SCTaskProgressUpdateNtf
{
    TaskData updated_data = 1;
    EnmTaskActionUpdateType updateType = 2;       
}



message CSTaskActionUpdate
{
    uint64 action_id = 1;
    uint32 task_type = 2;   
    uint32 progress = 3;    
}



message SCTaskActionUpdate
{
    int32 result = 1;
    uint64 action_id = 2;
    uint32 task_type = 3;   
    uint32 progress = 4;    
    uint32 max_progress = 5;    
}























