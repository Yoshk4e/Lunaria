syntax = "proto3";
package msg;

message PBBuffData
{
    uint32 id = 1;
    int32 attach_time = 2;
    int32 left_time = 3;
    int32 left_battle = 4;
}



message CSBuffSync
{
    int32 reserved = 1; 
}



message SCBuffSync
{
    int32 result = 1;
    repeated PBBuffData data = 2;
}



message SCBuffAdd
{
    int32 result = 1;
    PBBuffData data = 2;
}



message SCBuffDel
{
    int32 result = 1;
    uint32 id = 2;
}



message SCBuffUpdate
{
    int32 result = 1;
    PBBuffData data = 2;
}