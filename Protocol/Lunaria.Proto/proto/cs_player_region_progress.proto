syntax = "proto3";
package msg;

import "comm_macro.proto";


message ProgressData
{
    uint32 sequence_id = 1; 
    uint32 count = 2; 
}


message SubRegionProgress
{
    uint64 sub_region_id = 1; 
    repeated ProgressData progress = 2; 
    repeated EnmProgressValue progress_value = 3; 
}


message RegionProgress
{
    uint32 region_id = 1; 
    repeated SubRegionProgress sub_region_progress = 2; 
}



message CSReqRegionProgress
{
}



message SCResRegionProgress
{
    uint32 result = 1; 
    repeated RegionProgress region_progress = 2; 
}



message CSReqClaimReward
{
    uint64 sub_region_id = 1; 
}



message SCResClaimReward
{
    uint32 result = 1; 
    uint64 sub_region_id = 2; 
    repeated EnmProgressValue progress_values = 3; 
}



message SCUnlockSubRegionNtf
{
    uint64 sub_region_id = 1; 
}



message SCSubRegionUpdateNtf
{
    uint32 region_id = 1; 
    SubRegionProgress sub_region_data = 2; 
}